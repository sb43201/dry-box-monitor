[platformio]
default_envs = display

[env]
platform = espressif32@6.10.0
framework = arduino
monitor_speed = 115200
upload_speed = 921600

[env:display]
board = esp32dev
lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
  tzapu/WiFiManager@^2.0.17
  bblanchon/ArduinoJson@^7.4.2
  adafruit/Adafruit AHTX0@^2.0.5
  adafruit/Adafruit BMP280 Library@^2.6.8
build_src_filter =
  -<*>
  +<display/*>
build_flags =
  -D USER_SETUP_LOADED
  -D ST7796_DRIVER
  -D TFT_WIDTH=320
  -D TFT_HEIGHT=480
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D TFT_MOSI=13
  -D TFT_MISO=12
  -D TFT_SCLK=14
  -D TFT_BL=27
  -D TFT_BACKLIGHT_ON=HIGH
  -D TOUCH_CS=33
  -D USE_HSPI_PORT
  -D SUPPORT_TRANSACTIONS
  -D TFT_RGB_ORDER=TFT_BGR
  -D LOAD_GLCD
  -D LOAD_FONT2
  -D LOAD_FONT4
  -D LOAD_FONT6
  -D LOAD_FONT7
  -D LOAD_FONT8
  -D LOAD_GFXFF
  -D SMOOTH_FONT
  -D SPI_FREQUENCY=40000000
  -D SPI_READ_FREQUENCY=16000000
  -D SPI_TOUCH_FREQUENCY=2500000

[sensor_base]
board = esp32-c3-devkitm-1
lib_deps =
  adafruit/Adafruit AHTX0@^2.0.5
build_src_filter =
  -<*>
  +<sensor/*>
build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1

[env:sensor]
extends = sensor_base
build_flags = ${sensor_base.build_flags}
