[platformio]
default_envs = display

[env]
platform = espressif32@6.10.0
framework = arduino
monitor_speed = 115200
upload_speed = 921600

[env:display]
board = esp32dev
board_build.partitions = huge_app.csv
lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
  tzapu/WiFiManager@^2.0.17
  bblanchon/ArduinoJson@^7.4.2
  adafruit/Adafruit AHTX0@^2.0.5
  adafruit/Adafruit BMP280 Library@^2.6.8
build_src_filter =
  -<*>
  +<display/*>
build_flags =
  -D USER_SETUP_LOADED
  -D ST7796_DRIVER
  -D TFT_WIDTH=320
  -D TFT_HEIGHT=480
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D TFT_MOSI=13
  -D TFT_MISO=12
  -D TFT_SCLK=14
  -D TFT_BL=27
  -D TFT_BACKLIGHT_ON=HIGH
  -D TOUCH_CS=33
  -D USE_HSPI_PORT
  -D SUPPORT_TRANSACTIONS
  -D TFT_RGB_ORDER=TFT_BGR
  -D LOAD_GLCD
  -D LOAD_FONT2
  -D LOAD_FONT4
  -D LOAD_FONT6
  -D LOAD_FONT7
  -D LOAD_FONT8
  -D LOAD_GFXFF
  -D SMOOTH_FONT
  -D SPI_FREQUENCY=40000000
  -D SPI_READ_FREQUENCY=16000000
  -D SPI_TOUCH_FREQUENCY=2500000

[sensor_esp32_base]
board = wemos_d1_mini32
lib_deps =
  adafruit/Adafruit AHTX0@^2.0.5
  adafruit/Adafruit BMP280 Library@^2.6.8
  adafruit/Adafruit SSD1306@^2.5.13
build_src_filter =
  -<*>
  +<sensor/*>

[env:sensor_wemos_d1_mini32]
extends = sensor_esp32_base
build_flags =
  -D DRYBOX_SDA_PIN=21
  -D DRYBOX_SCL_PIN=22
  -D DRYBOX_PAIR_BUTTON_PIN=0
  -D DRYBOX_LED_PIN=2
  -D DRYBOX_LED_ACTIVE_HIGH=1

[env:sensor_wemos_d1_esp8266]
platform = espressif8266@4.2.1
framework = arduino
board = d1_mini
monitor_speed = 115200
upload_speed = 921600
lib_deps =
  adafruit/Adafruit AHTX0@^2.0.5
  adafruit/Adafruit BMP280 Library@^2.6.8
  adafruit/Adafruit SSD1306@^2.5.13
build_src_filter =
  -<*>
  +<sensor_esp8266/*>
